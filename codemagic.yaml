workflows:
  android-workflow:
    name: İTRİ APK Build
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Flutter versiyonu
        script: flutter --version
      - name: Bağımlılıkları yükle
        script: flutter pub get
      - name: APK derle
        script: |
          flutter build apk \
            --release \
            --target-platform android-arm64
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
    publishing:
      email:
        recipients:
          - senin@emailin.com
        notify:
          success: true
          failure: true
